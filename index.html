<!DOCTYPE html>
<!--
  БЫСТРАЯ ОБОЛОЧКА КАТАЛОГА.
  Лежит на GitHub Pages, открывается мгновенно, данные забирает
  из Apps Script (?data=json) и кэширует на телефоне дилера.

  ЕДИНСТВЕННАЯ НАСТРОЙКА: вставь ссылку /exec в строку var EXEC ниже.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог ламината</title>

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://drive.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script defer src="https://telegram.org/js/telegram-web-app.js" onload="window.tgInit&&tgInit()"></script>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap"></noscript>

<style>
  :root{
    color-scheme:light;
    --ground:#f7f5f2; --surface:#ffffff; --surface-2:#efece7;
    --ink:#1d1a17; --muted:#7a736b; --line:#e5e0d9;
    --accent:#0e6b5e; --accent-soft:#e2efeb;
    --warn:#8a5a00; --warn-soft:#fbf0d8;
    --crit:#a02020; --crit-soft:#fae9e7;
    --shadow:0 1px 2px rgba(29,26,23,.06), 0 6px 16px rgba(29,26,23,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ground:#151310; --surface:#201d19; --surface-2:#2a2621;
      --ink:#ece7e0; --muted:#9c948a; --line:#332e28;
      --accent:#5cc4ae; --accent-soft:#123029;
      --warn:#e5b45c; --warn-soft:#33280f;
      --crit:#ef8f88; --crit-soft:#3a1d1a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#151310; --surface:#201d19; --surface-2:#2a2621;
    --ink:#ece7e0; --muted:#9c948a; --line:#332e28;
    --accent:#5cc4ae; --accent-soft:#123029;
    --warn:#e5b45c; --warn-soft:#33280f;
    --crit:#ef8f88; --crit-soft:#3a1d1a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.3);
  }
  :root[data-theme="light"]{ color-scheme:light }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);color:var(--ink);
    font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  header{
    position:sticky;top:0;z-index:20;background:var(--ground);
    border-bottom:1px solid var(--line);padding:12px 14px 10px;
  }
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .brand h1{
    font-family:Oswald,"Golos Text",sans-serif;font-weight:600;font-size:19px;
    margin:0;letter-spacing:.06em;text-transform:uppercase;
  }
  .brand .sub{
    font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;
    font-family:Oswald,sans-serif;margin-left:auto;
  }
  .tbtn{
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;padding:0;margin-left:9px;
    border:1px solid var(--line);border-radius:8px;
    background:var(--surface);color:var(--muted);cursor:pointer;
  }
  .tbtn:hover{color:var(--accent);border-color:var(--accent)}
  .tbtn svg{width:17px;height:17px;display:block}
  #back{display:none;margin-left:0;margin-right:2px}
  #lang{width:auto;padding:0 8px;gap:6px}
  .brand{position:relative}
  .flag{width:20px;height:14px;border-radius:3px;flex:0 0 auto;display:block;
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
  .lcode{font-size:10.5px;font-weight:700;letter-spacing:.04em}

  /* Меню выбора языка */
  .lmenu{
    position:absolute;top:calc(100% + 6px);right:0;z-index:40;display:none;
    min-width:172px;padding:5px;border-radius:11px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .lmenu.on{display:block}
  .lmenu button{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;
    border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;
    font-family:inherit;font-size:14px;color:var(--ink);
  }
  .lmenu button:hover{background:var(--surface-2)}
  .lmenu button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

  /* Плитки категорий на главном экране */
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  @media (min-width:720px){.cats{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
  .catile{
    position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
    padding:0;text-align:left;font-family:inherit;
  }
  .catile:hover{border-color:var(--accent)}
  .catile .ic{
    position:absolute;top:11px;left:11px;width:40px;height:40px;border-radius:11px;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .catile .ic svg{width:23px;height:23px;display:block}
  .catile .nm{
    position:absolute;left:12px;right:12px;bottom:10px;color:var(--ink);
    font-weight:600;font-size:14.5px;line-height:1.25;
  }
  .catile .ct{
    position:absolute;top:14px;right:12px;padding:2px 8px;border-radius:999px;
    background:var(--surface-2);color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;
  }

  .topline{display:flex;gap:8px;align-items:stretch}
  .field{position:relative;flex:1 1 auto;min-width:0}
  .field input{
    width:100%;height:100%;padding:11px 34px 11px 13px;font-size:16px;
    font-family:inherit;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:10px;
  }
  .field input::placeholder{color:var(--muted)}
  .field input:focus{outline:none;border-color:var(--accent)}
  .field button{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;
    border:0;background:none;color:var(--muted);font-size:21px;line-height:1;
    padding:5px 8px;cursor:pointer;font-family:inherit;
  }

  .fbtn{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:0 13px;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:600;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
  }
  .fbtn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .fbtn .caret{transition:transform .18s}
  .fbtn[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .fbtn .cnt{
    display:none;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--accent);color:var(--ground);
    font-size:11px;line-height:17px;text-align:center;font-variant-numeric:tabular-nums;
  }
  .fbtn .cnt.on{display:inline-block}

  #filters[hidden]{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chips.hide{display:none}
  .chips#modes{border-top:1px solid var(--line);padding-top:8px}
  .chip{
    flex:0 0 auto;padding:6px 12px;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:500;line-height:1.2;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);
  }
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .chips.spec .chip[aria-pressed="true"]{font-family:Oswald,sans-serif;letter-spacing:.03em}

  @media (max-width:400px){
    header{padding:10px 12px 8px}
    .brand{margin-bottom:9px}
    .brand h1{font-size:17px}
    .chips{gap:5px;margin-top:7px}
    .chip{padding:5px 10px;font-size:12.5px}
    .field input{padding:10px 32px 10px 12px}
    .fbtn{padding:0 11px;font-size:13px}
  }

  main{padding:14px}
  .grouphead{
    display:flex;align-items:baseline;gap:9px;margin:22px 2px 10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .grouphead:first-child{margin-top:0}
  .grouphead h2{
    font-family:Oswald,sans-serif;font-weight:500;font-size:13px;margin:0;
    letter-spacing:.07em;text-transform:uppercase;color:var(--ink);
  }
  .grouphead span{font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}
  @media (min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);
  }
  .shot{position:relative;aspect-ratio:3/4;background:var(--surface-2);cursor:zoom-in}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .blank{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-family:Oswald,sans-serif;font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  .info{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
  .decor{
    font-size:13px;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .meta .art{font-variant-numeric:tabular-nums}
  .meta .spec{
    margin-left:auto;padding:1px 6px;border-radius:4px;background:var(--surface-2);
    font-family:Oswald,sans-serif;letter-spacing:.04em;white-space:nowrap;
  }
  .pack{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-1px}
  .tag{
    margin-top:auto;align-self:flex-start;font-size:11.5px;font-weight:600;
    padding:3px 8px;border-radius:5px;font-variant-numeric:tabular-nums;
    background:var(--surface-2);color:var(--ink);
  }
  .t-low{background:var(--warn-soft);color:var(--warn)}
  .t-no{background:var(--crit-soft);color:var(--crit)}
  .t-ord{background:var(--accent-soft);color:var(--accent)}
  .t-na{background:var(--surface-2);color:var(--muted);font-weight:500}

  /* скелет на самое первое открытие, пока едут данные */
  .sk{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .sk .ph{aspect-ratio:3/4;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
  .sk .ln{height:11px;margin:10px;border-radius:5px;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
  .sk .ln.s{width:55%;margin-top:0}
  @keyframes pulse{50%{opacity:.45}}

  #more{
    display:none;width:100%;margin:22px 0 4px;padding:13px;
    border:1px solid var(--line);border-radius:11px;
    background:var(--surface);color:var(--accent);cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;
  }
  #more.on{display:block}
  #more:hover{border-color:var(--accent)}

  .none{text-align:center;color:var(--muted);padding:56px 16px;font-size:14px}
  .none button{
    display:block;margin:14px auto 0;padding:9px 22px;border-radius:9px;cursor:pointer;
    border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);
    font-family:inherit;font-size:14px;font-weight:600;
  }
  footer{
    text-align:center;color:var(--muted);font-size:11px;
    padding:22px 16px 34px;border-top:1px solid var(--line);margin-top:22px;
  }
  .byline{margin-top:7px;font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.14em;
          text-transform:uppercase;color:var(--muted);opacity:.75}
  .byline b{color:var(--accent);font-weight:600}

  /* Лист с прокруткой: фото сверху, характеристики под ним.
     Подложка непрозрачная — сетка позади не должна просвечивать. */
  #view{
    position:fixed;inset:0;z-index:60;display:none;background:#0c0a08;
    flex-direction:column;align-items:center;gap:12px;
    padding:16px 16px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  #view.on{display:flex}
  #view img{
    flex:0 0 auto;width:100%;max-width:420px;max-height:42vh;
    object-fit:contain;border-radius:10px;
  }
  #view p{margin:0;color:#f2ede6;font-size:14px;font-weight:600;text-align:center;max-width:460px;line-height:1.35}
  #vclose{
    position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:2;
    width:34px;height:34px;padding:0;border:0;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.16);color:#f2ede6;font:20px/34px inherit;text-align:center;
  }
  #vclose:hover{background:rgba(255,255,255,.26)}
  #view small{color:#8f8579;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-family:Oswald,sans-serif}
  .vsizes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px}
  .vsz{background:rgba(255,255,255,.14);color:#f2ede6;padding:5px 11px;border-radius:8px;
       font-size:13px;font-variant-numeric:tabular-nums}
  .vsz.z{opacity:.5;text-decoration:line-through}
  .vspec{width:100%;max-width:420px;border-collapse:collapse;font-size:12.5px}
  .vspec td{padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.12);color:#f2ede6}
  .vspec td:first-child{color:#a49a8e;white-space:nowrap;padding-right:14px}
  .vspec td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .vspec tr:last-child td{border-bottom:0}
</style>
</head>
<body>

<header>
  <div class="brand">
    <button id="back" class="tbtn" type="button" aria-label="К категориям">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">Каталог</h1>
    <span class="sub" id="sub"></span>
    <button id="lang" class="tbtn" type="button" aria-label="Язык / Til / Language">RU</button>
    <button id="theme" class="tbtn" type="button" aria-label="Тема оформления"></button>
  </div>

  <div class="topline">
    <div class="field">
      <input id="q" type="search" inputmode="search" autocomplete="off"
             placeholder="Декор или артикул" aria-label="Поиск по каталогу">
      <button id="clr" type="button" aria-label="Очистить поиск">&times;</button>
    </div>
    <button id="ftoggle" class="fbtn" type="button" aria-expanded="false" aria-controls="filters">
      <span id="flabel">Фильтры</span><span id="fcount" class="cnt"></span>
      <svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div id="filters" hidden>
    <div class="chips" id="factories"></div>
    <div class="chips spec" id="specs"></div>
    <div class="chips" id="modes">
      <button class="chip" data-mode="all" aria-pressed="true">Все</button>
      <button class="chip" data-mode="in"  aria-pressed="false" data-onlyout>В наличии</button>
      <button class="chip" data-mode="low" aria-pressed="false">Мало</button>
    </div>
  </div>
</header>

<main id="out"></main>
<button id="more" type="button"></button>
<footer><span id="foot" hidden></span>
  <div class="byline">created by <b>Phenomen&Azizbek</b></div>
</footer>

<div id="view" role="dialog" aria-modal="true">
  <button id="vclose" type="button" aria-label="Закрыть">&times;</button>
  <img id="viewImg" alt="">
  <p id="viewTxt"></p>
  <div id="viewSizes" class="vsizes"></div>
  <table id="viewSpec" class="vspec"></table>
  <small id="closeHint">нажмите, чтобы закрыть</small>
</div>

<script>
  // ═══════════ ЕДИНСТВЕННАЯ НАСТРОЙКА ═══════════

  // ═══════════ Состояние ═══════════

      themeAuto: 'Тема: как в системе', themeLight: 'Тема: светлая', themeDark: 'Тема: тёмная',

      close: 'yopish uchun fonga bosing', back: 'Kategoriyalar',
      themeAuto: 'Mavzu: tizim bo‘yicha', themeLight: 'Mavzu: yorug‘', themeDark: 'Mavzu: qorong‘i',

    en: {

      allF: 'All factories', any: 'Any', all: 'All', instock: 'In stock', lowF: 'Low',

      na: 'check stock', m2: 'm²', pcs: 'pcs', none: 'Nothing found', noPhoto: 'no photo',
      art: 'no.', factory: 'Factory', collection: 'Collection', thickness: 'Thickness',
      klass: 'Class', chamfer: 'Bevel', dims: 'Size', length: 'Length', width: 'Width', planks: 'Planks per pack',

      yes: 'yes', no: 'no', packs: 'packs', specs: 'Specifications',
      close: 'tap the background to close', back: 'Categories',
      themeAuto: 'Theme: system', themeLight: 'Theme: light', themeDark: 'Theme: dark',
      more: function(n, l){ return 'Show ' + n + ' more of ' + l; },

  var LANGS = ['ru', 'uz', 'en'];
  var lang = 'ru';

  function T(){ return I18N[lang]; }

  /** Известные категории переводятся, незнакомые показываются как в таблице. */
  var CAT_NAMES = [
    [/фурнитур/i,         { uz: 'Furnitura',        en: 'Hardware' }],
    [/двер/i,             { uz: 'Eshiklar',         en: 'Doors' }],
    [/паркет/i,           { uz: 'Parket',           en: 'Parquet' }],
    [/ламинат/i,          { uz: 'Laminat',          en: 'Laminate' }],
    [/панел|стен|декор/i, { uz: 'Devor panellari',  en: 'Wall panels' }],
    [/профил|угол/i,      { uz: 'Profillar',        en: 'Profiles' }],
    [/подлож/i,           { uz: 'Podlojka',         en: 'Underlay' }],
    [/плинт/i,            { uz: 'Plintuslar',       en: 'Skirting' }],
    [/компенсат|порог/i,  { uz: 'Kompensator',      en: 'Transition strips' }],
  ];
  function catName(c){
    if (lang === 'ru') return c;
    for (var i = 0; i < CAT_NAMES.length; i++) {
      if (CAT_NAMES[i][0].test(c)) return CAT_NAMES[i][1][lang] || c;
    }
    return c;
  }

  /** Плашка нулевого остатка: стандартные надписи переводятся, свой текст — как есть. */
  function outInfo(){
    var k = OUTLABEL.trim().toLowerCase();
    if (k === 'нет в наличии') return ['t-no',  T().out];
    if (k === 'под заказ')     return ['t-ord', T().order];
    return [/нет|yo['’`]?q|emas|out/i.test(OUTLABEL) ? 't-no' : 't-ord', OUTLABEL];
  }
  var limit = BATCH;
  var tg = null;

  /** Строка внизу каталога задаётся в настройках; пустая — не показывается вовсе. */

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });

  function fmt(n){ return Number(n).toLocaleString('ru-RU', {maximumFractionDigits: 2}); }

  }

  function updateCount(){

  function inStock(it){ return it.q !== null && !isNaN(it.q) && it.q >= MINSTOCK; }

  /** Таблица характеристик для увеличенной карточки. Пустые поля пропускаются. */
  function specRows(it){
    var s = it.s || {}, r = [];
    if (it.f && it.f !== "—") r.push([T().factory, it.f]);
    if (it.c) r.push([T().collection, it.c]);
    if (s.th) r.push([T().thickness, s.th + " мм"]);
    if (s.cl) r.push([T().klass, s.cl]);
    if (s.ch !== undefined) r.push([T().chamfer, s.ch ? T().yes : T().no]);
    // Длина и ширина одной строкой: «1292 × 246 мм» вместо двух рядов
    if (s.ln && s.wd)  r.push([T().dims, fmt(s.ln) + " × " + fmt(s.wd) + " мм"]);
    else if (s.ln)     r.push([T().length, fmt(s.ln) + " мм"]);
    else if (s.wd)     r.push([T().width, fmt(s.wd) + " мм"]);
    if (s.pn) r.push([T().planks, s.pn]);
    if (s.pk) r.push([T().perPack, fmt(s.pk) + " " + T().m2]);
    if (s.pd) {
      var v = s.pd + " " + T().packs;
      if (s.pk) v += " · " + fmt(s.pd * s.pk) + " " + T().m2;
      r.push([T().perPallet, v]);
    }
    return r;
  }

  /** Единица измерения позиции: у ламината м², у дверей шт, из колонки «Ед.» — что угодно. */
  function unitOf(it){
    var u = String(it.u || '').toLowerCase();
    if (!u || u === 'м²' || u === 'м2' || u === 'm2') return T().m2;
    if (u === 'шт' || u === 'шт.') return T().pcs;
    return it.u;
  }

  function tagOf(it){
    if (it.q === null || isNaN(it.q)) return ['t-na', T().na];
    if (it.q < MINSTOCK)              return outInfo();
    if (it.q < it.w)                  return ['t-low', T().low + ' · ' + fmt(it.q) + ' ' + unitOf(it)];
    return ['', NUMBERS ? fmt(it.q) + ' ' + unitOf(it) : T().inst];
  }

  function uniq(items, key){
    var seen = {}, out = [];
    items.forEach(function(it){
      var v = it[key];
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    return out;
  }

  function chipRow(el, values, field, allLabel){
    if (values.length < 2) { el.classList.add('hide'); return; }
    el.classList.remove('hide');

    var cur = state[field];
    if (cur !== 'all' && values.indexOf(cur) < 0) { state[field] = cur = 'all'; }

    el.innerHTML = '<button class="chip" data-v="all" aria-pressed="' + (cur === 'all') + '">' +
                   allLabel + '</button>' +
      values.map(function(v){
        return '<button class="chip" data-v="' + esc(v) + '" aria-pressed="' + (cur === v) + '">' +
               esc(v) + '</button>';
      }).join('');
  }

  function bindRow(el, field){

  clr.addEventListener('click', function(){
    q.value = ''; state.q = ''; clr.style.display = 'none'; render(); q.focus();
  });

  // ═══════════ Отрисовка ═══════════
  var moreBtn = document.getElementById('more');

  function inCat(){
    return DATA.filter(function(it){ return !state.cat || (it.k || '') === state.cat; });
  }

  function selected(){
    return inCat().filter(function(it){
      if (state.f !== 'all' && it.f !== state.f) return false;
      if (state.p !== 'all' && it.p !== state.p) return false;
      if (state.mode === 'in'  && !inStock(it)) return false;
      if (state.mode === 'low' && !(inStock(it) && it.q < it.w)) return false;
      if (state.q) {
        var hay = it.d + ' ' + it.a + ' ' + it.c +
                  (it.v ? ' ' + it.v.map(function(p){ return p[0]; }).join(' ') : '');
        if (hay.toLowerCase().indexOf(state.q) < 0) return false;
      }
      return true;
    });
  }

  var REG = [];   // карточки текущей отрисовки — для просмотрщика

  function cardHtml(it){
    var tag = tagOf(it);
    REG.push(it);
    // Карточка раскрывается всегда: внутри фото, размеры и характеристики
    return '<article class="card">'
         +   '<div class="shot" data-vi="' + (REG.length - 1) + '" tabindex="0">'
         +     (it.i
                 ? '<img src="' + esc(imgUrl(it.i)) + '" alt="' + esc(it.d) + '" loading="lazy" decoding="async">'
                 : '<div class="blank">' + esc(T().noPhoto) + '</div>')
         +   '</div>'
         +   '<div class="info">'
         +     '<div class="decor">' + esc(it.d) + '</div>'
         +     '<div class="meta"><span class="art">' + esc(T().art) + ' ' + esc(it.a || '—') + '</span>'
         +       (it.p ? '<span class="spec">' + esc(it.p) + '</span>' : '') + '</div>'
         +     (it.s && it.s.pk ? '<div class="pack">' + fmt(it.s.pk) + ' ' + T().m2 + ' · ' + T().perPack.toLowerCase() + '</div>' : '')
         +     '<span class="tag ' + tag[0] + '">' + esc(tag[1]) + '</span>'
         +   '</div>'
         + '</article>';
  }

  function render(reset){
    if (reset !== false) limit = BATCH;
    REG.length = 0;

    var cat = inCat();
    chipRow(elF, uniq(cat, 'f'), 'f', T().allF);
    var byFactory = cat.filter(function(it){ return state.f === 'all' || it.f === state.f; });
    chipRow(elP, uniq(byFactory, 'p'), 'p', T().any);
    updateCount();

    var all = selected();

    // Продвижение: позиции с большим «Приоритетом» выходят первыми и поднимают
    // свою коллекцию в начало. Для дилера это выглядит просто порядком каталога.
    all = all.map(function(it, i){ return [it, i]; })
             .sort(function(a, b){ return (b[0].b || 0) - (a[0].b || 0) || a[1] - b[1]; })
             .map(function(p){ return p[0]; });

    // Заголовок группы показывает общее число позиций, даже если нарисована ещё не вся.
    // Одна коллекция встречается в разных толщинах, поэтому при «Любой» ключ разворачивается.
    var specific = state.p !== "all";
    var manyF    = uniq(all, "f").length > 1;

    // Коллекции нет (плинтусы, фурнитура) — тогда режем только по заводу,
    // а внутри завода весь ассортимент идёт одной непрерывной сеткой.
    function keyOf(it){
      if (it.c) return (specific || !it.p) ? it.c : it.p + " · " + it.c;
      return manyF ? it.f : "";

    var totals = {};
    all.forEach(function(it){ var k = keyOf(it); totals[k] = (totals[k] || 0) + 1; });

    var visible = all.slice(0, limit);
    var order = [], buckets = {};
    visible.forEach(function(it){
      var k = keyOf(it);
      if (!buckets[k]) { buckets[k] = []; order.push(k); }
      buckets[k].push(it);
    });

    var html = '';
    order.forEach(function(k){
      if (k) html += "<div class=\"grouphead\"><h2>" + esc(k) + "</h2><span>" + totals[k] + "</span></div>";
      html += "<div class=\"grid\">" + buckets[k].map(cardHtml).join("") + "</div>";
    });

    document.getElementById('out').innerHTML =
      all.length ? html : '<div class="none">' + esc(T().none) + '</div>';

    var left = all.length - visible.length;
    moreBtn.classList.toggle('on', left > 0);
    moreBtn.textContent = left > 0 ? T().more(Math.min(left, BATCH), left) : '';
  }

  // ═══════════ Просмотр фото ═══════════

  // Флаги нарисованы SVG — эмодзи-флаги на Windows превращаются в буквы «GB»
  var LANG_META = {

  window.tgLang = function(){
    function autoDetect(){
      if (store('lang')) return;           // явный выбор важнее автоопределения

                   tg.initDataUnsafe.user.language_code || '';

  // ═══════════ Данные: мгновенно из кэша, свежее — следом ═══════════
  function applyPayload(p){
    if (!p || !p.items) return false;
    if (p.cfg) {
      NUMBERS  = !!p.cfg.numbers;
      MINSTOCK = Number(p.cfg.minstock) || 0;
      BATCH    = Number(p.cfg.batch) || 24;
      HIDEOUT  = !!p.cfg.hideout;
      OUTLABEL = p.cfg.outlabel || OUTLABEL;

      document.getElementById('sub').textContent = p.cfg.subtitle || '';
      var only = document.querySelector('[data-onlyout]');

    route();
    return true;

  // ─────────── Категории: главный экран ───────────
  function categories(){ return uniq(DATA, 'k'); }

  /** Иконка подбирается по названию категории; незнакомым — коробка. */
  var SVG_ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
  // Порядок важен: «Фурнитура (дверная)» проверяется раньше дверей,
  // «Паркет» — раньше ламината, «Стеновые панели и профили» — раньше профиля.
  var CAT_ICONS = [
    [/фурнитур|ручк|замк/i,                 // дверная ручка на розетке
      SVG_ + '<circle cx="7.3" cy="12" r="3.1"/><path d="M10.4 11h8.1a1.6 1.6 0 0 1 1.6 1.6V16"/></svg>'],
    [/двер/i,                               // дверной проём
      SVG_ + '<path d="M5 20V5.5A1.5 1.5 0 0 1 6.5 4h11A1.5 1.5 0 0 1 19 5.5V20"/><path d="M3 20h18"/><circle cx="15.3" cy="12.3" r="1" fill="currentColor" stroke="none"/></svg>'],
    [/паркет/i,                             // диагональная укладка
      SVG_ + '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 11.5 10.5 4M3 18 17 4M8.5 20 21 7.5M15 20l6-6"/></svg>'],
    [/ламинат|пол/i,                        // доски вразбежку
      SVG_ + '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.3h18M3 14.6h18M12 4v5.3M7.5 9.3v5.3M16 14.6V20"/></svg>'],
    [/панел|стен|декор/i,                   // рейки на стене
      SVG_ + '<rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M8.2 4v16M12.9 4v16M17.6 4v16"/></svg>'],
    [/профил|угол|алюмин/i,                 // уголок-профиль в сечении
      SVG_ + '<path d="M6 3v13a2.5 2.5 0 0 0 2.5 2.5H21"/><path d="M10.5 3v9a2 2 0 0 0 2 2H21"/></svg>'],
    [/подлож/i,                             // слои
      SVG_ + '<path d="M12 3 21 8l-9 5-9-5 9-5z"/><path d="m3 12.2 9 5 9-5"/><path d="m3 16.2 9 5 9-5"/></svg>'],
    [/плинт/i,                              // профиль плинтуса у стены
      SVG_ + '<path d="M6 3v18"/><path d="M3 21h18"/><path d="M6 13h3.2a1.3 1.3 0 0 1 1.3 1.3V21"/></svg>'],
    [/компенсат|порог|молдинг/i,            // Т-порожек между двумя полами
      SVG_ + '<path d="M8.3 10.5h7.4"/><path d="M12 10.5V18"/><path d="M3 13.5h5M16 13.5h5"/><path d="M3 18h6M15 18h6"/></svg>'],
  ];
  var CAT_DEFAULT =
      SVG_ + '<path d="M21 8.2 12 12.7 3 8.2 12 3.8l9 4.4z"/><path d="M3 8.2v7.6l9 4.4 9-4.4V8.2"/><path d="M12 12.7v7.5"/></svg>';

  function iconFor(name){
    for (var i = 0; i < CAT_ICONS.length; i++) {
      if (CAT_ICONS[i][0].test(name)) return CAT_ICONS[i][1];
    }
    return CAT_DEFAULT;
  }

  function chrome(home){
    var multi = categories().length > 1;
    document.querySelector('.topline').style.display = home ? 'none' : '';
    if (home) { panel.hidden = true; ftog.setAttribute('aria-expanded', 'false'); }
    document.getElementById('back').style.display = (!home && multi) ? 'flex' : 'none';
    document.getElementById('title').textContent = home || !multi ? T().catalog : catName(state.cat);
    try {
      if (tg && tg.BackButton) { if (!home && multi) tg.BackButton.show(); else tg.BackButton.hide(); }
    } catch (e) {}
  }

  function renderHome(){
    var count = {};
    DATA.forEach(function(it){
      var k = it.k || '';
      count[k] = (count[k] || 0) + 1;
    });

    var html = '<div class="cats">' + categories().map(function(c){
      return '<button class="catile" data-cat="' + esc(c) + '" type="button">'
           +   '<span class="ic">' + iconFor(c) + '</span>'
           +   '<span class="ct">' + count[c] + '</span>'
           +   '<span class="nm">' + esc(catName(c)) + '</span>'
           + '</button>';
    }).join('') + '</div>';

    document.getElementById('out').innerHTML = html;
    moreBtn.classList.remove('on');
  }

  function enterCat(c){
    state.cat = c;
    state.f = 'all'; state.p = 'all'; state.mode = 'all'; state.q = '';
    q.value = ''; clr.style.display = 'none';
    var m = document.getElementById('modes');
    [].forEach.call(m.children, function(b){ b.setAttribute('aria-pressed', b.dataset.mode === 'all'); });
    chrome(false);
    render();
    try { scrollTo(0, 0); } catch (e) {}
  }

  function goHome(){
    if (categories().length < 2) return;
    state.cat = null;
    chrome(true);
    renderHome();
  }

  document.getElementById('out').addEventListener('click', function(ev){
    var t = ev.target.closest('.catile');
    if (t) enterCat(t.dataset.cat);
  });
  document.getElementById('back').addEventListener('click', goHome);

  function route(){
    var cs = categories();
    if (cs.length < 2) {              // одна категория — сразу каталог, без главного экрана
      state.cat = cs[0] || null;
      chrome(false);
      render();
    } else if (state.cat && cs.indexOf(state.cat) >= 0) {
      chrome(false);
      render();
    } else {
      goHome();
    }
  }

  function skeleton(){
    var one = '<div class="sk"><div class="ph"></div><div class="ln"></div><div class="ln s"></div></div>';
    document.getElementById('out').innerHTML =
      '<div class="grid">' + new Array(9).join(one) + '</div>';
  }

  function fail(){
    document.getElementById('out').innerHTML =
      '<div class="none">Не удалось загрузить каталог.<br>Проверьте связь и попробуйте ещё раз.' +
      '<button type="button" onclick="location.reload()">Повторить</button></div>';
  }

  // 1. Мгновенная отрисовка из локального кэша прошлого визита
  var shownFromCache = false;
  try {
    var cached = store('payload');
    if (cached) shownFromCache = applyPayload(JSON.parse(cached));
  } catch (e) {}
  if (!shownFromCache) skeleton();

  // 2. Свежие данные из Apps Script — подменяют картинку без мигания
  fetch(EXEC + '?data=json&t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(p){
      applyPayload(p);
      store('payload', JSON.stringify(p));
    })
    .catch(function(){
      if (!shownFromCache) fail();      // кэш уже на экране — молча остаёмся на нём
    });
</script>
</body>
</html>
