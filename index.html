    color-scheme:light;

  .lcode{font-size:10.5px;font-weight:700;letter-spacing:.04em}

  /* Меню выбора языка */
  .lmenu{
    position:absolute;top:calc(100% + 6px);right:0;z-index:40;display:none;
    min-width:172px;padding:5px;border-radius:11px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .lmenu.on{display:block}
  .lmenu button{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;
    border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;
    font-family:inherit;font-size:14px;color:var(--ink);
  }
  .lmenu button:hover{background:var(--surface-2)}
  .lmenu button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}

    border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);
    padding:0;text-align:left;font-family:inherit;
  }
  .catile:hover{border-color:var(--accent)}

    position:absolute;top:11px;left:11px;width:40px;height:40px;border-radius:11px;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;

  .catile .nm{

    font-weight:600;font-size:14.5px;line-height:1.25;
  }

    background:var(--surface-2);color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;

    width:100%;height:100%;padding:11px 34px 11px 13px;font-size:16px;
    font-family:inherit;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:10px;
  }
  .field input::placeholder{color:var(--muted)}
  .field input:focus{outline:none;border-color:var(--accent)}
  .field button{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;
    border:0;background:none;color:var(--muted);font-size:21px;line-height:1;
    padding:5px 8px;cursor:pointer;font-family:inherit;
  }

  .fbtn{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:0 13px;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:600;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);

    display:none;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
    background:var(--accent);color:var(--ground);
    font-size:11px;line-height:17px;text-align:center;font-variant-numeric:tabular-nums;
  }
  .fbtn .cnt.on{display:inline-block}

    flex:0 0 auto;padding:6px 12px;border-radius:999px;cursor:pointer;

    header{padding:10px 12px 8px}
    .brand{margin-bottom:9px}
    .brand h1{font-size:17px}
    .chips{gap:5px;margin-top:7px}
    .chip{padding:5px 10px;font-size:12.5px}
    .field input{padding:10px 32px 10px 12px}
    .fbtn{padding:0 11px;font-size:13px}
  }

  main{padding:14px}
  .grouphead{
    display:flex;align-items:baseline;gap:9px;margin:22px 2px 10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }

  .grouphead h2{
    font-family:Oswald,sans-serif;font-weight:500;font-size:13px;margin:0;
    letter-spacing:.07em;text-transform:uppercase;color:var(--ink);

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);
  }

  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .blank{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-family:Oswald,sans-serif;font-size:11px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  .info{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}

    font-size:13px;font-weight:600;line-height:1.25;

  .meta .art{font-variant-numeric:tabular-nums}

  }

  .t-na{background:var(--surface-2);color:var(--muted);font-weight:500}

  .sk{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}

  #view{
    position:fixed;inset:0;z-index:60;display:none;background:#0c0a08;
    flex-direction:column;align-items:center;
    overflow:hidden;
  }
  #view.on{display:flex}

  .vcard{position:relative;display:flex;flex-direction:column;flex:1 1 auto;width:100%;max-width:520px;height:100%;background:#171411}

  .vcard.noimg img{display:none}
  .vover{
    flex:0 0 auto;max-height:62%;overflow-y:auto;

    background:#121009;border-top:1px solid rgba(255,255,255,.08);

  #vclose{
    position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:2;
    width:34px;height:34px;padding:0;border:0;border-radius:50%;cursor:pointer;
    background:rgba(255,255,255,.18);color:#f2ede6;font:20px/34px inherit;text-align:center;
  }
  #vclose:hover{background:rgba(255,255,255,.28)}
  #view small{display:block;margin-top:10px;text-align:center;color:#8f8579;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-family:Oswald,sans-serif}  .vsizes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .vsz{background:rgba(255,255,255,.16);color:#f2ede6;padding:3px 8px;border-radius:6px;
       font-size:12px;font-variant-numeric:tabular-nums}
  .vsz.z{opacity:.5;text-decoration:line-through}
  /* Характеристики — сетка в два столбца: подпись мелко сверху, значение под ней */
  .vspec{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
  .vs{min-width:0;line-height:1.2}
  .vs.wide{grid-column:1/-1}
  .vs i{display:block;font-style:normal;color:#b3a898;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase}
  .vs b{display:block;color:#fff;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
</head>

      if (window.tgLang) tgLang();       // язык из профиля Telegram, пока нет явного выбора
    } catch (e) {}
  };
  window.tgInit();

  // ═══════════ Фильтры ═══════════
  var panel = document.getElementById('filters');
  var ftog  = document.getElementById('ftoggle');

  function setFilters(open){
    panel.hidden = !open;
    ftog.setAttribute('aria-expanded', open ? 'true' : 'false');
    store('filters', open ? '1' : '0');

  setFilters(store('filters') === '1');
  ftog.addEventListener('click', function(){ setFilters(panel.hidden); });

  function updateCount(){
    var n = (state.f !== 'all') + (state.p !== 'all') + (state.mode !== 'all');
    var el = document.getElementById('fcount');
    el.textContent = n || '';
    el.classList.toggle('on', n > 0);
  }

  function inStock(it){ return it.q !== null && !isNaN(it.q) && it.q >= MINSTOCK; }

  /** Таблица характеристик для увеличенной карточки. Пустые поля пропускаются. */
  function specRows(it){
    var s = it.s || {}, r = [];
    if (it.f && it.f !== "—") r.push([T().factory, it.f]);
    if (it.c) r.push([T().collection, it.c]);
    if (s.th) r.push([T().thickness, s.th + " мм"]);
    if (s.cl) r.push([T().klass, s.cl]);
    if (s.ch !== undefined) r.push([T().chamfer, s.ch ? T().yes : T().no]);
    // Длина и ширина одной строкой: «1292 × 246 мм» вместо двух рядов
    if (s.ln && s.wd)  r.push([T().dims, fmt(s.ln) + " × " + fmt(s.wd) + " мм"]);
    else if (s.ln)     r.push([T().length, fmt(s.ln) + " мм"]);
    else if (s.wd)     r.push([T().width, fmt(s.wd) + " мм"]);
    if (s.pn) r.push([T().planks, s.pn]);
    if (s.pk) r.push([T().perPack, fmtX(s.pk) + " " + T().m2]);
    if (s.pd) {
      var v = s.pd + " " + T().packs;
      if (s.pk) v += " · " + fmtX(s.pd * s.pk) + " " + T().m2;
      r.push([T().perPallet, v]);
    }
    return r;
  }

  /** Единица измерения позиции: у ламината м², у дверей шт, из колонки «Ед.» — что угодно. */
  function unitOf(it){
    var u = String(it.u || '').toLowerCase();
    if (!u || u === 'м²' || u === 'м2' || u === 'm2') return T().m2;
    if (u === 'шт' || u === 'шт.') return T().pcs;
    return it.u;
  }

  function tagOf(it){
    if (it.q === null || isNaN(it.q)) return ['t-na', T().na];
    if (it.q < MINSTOCK)              return outInfo();
    if (it.q < it.w)                  return ['t-low', T().low + ' · ' + fmt(it.q) + ' ' + unitOf(it)];
    return ['', NUMBERS ? fmt(it.q) + ' ' + unitOf(it) : T().inst];
  }

  function uniq(items, key){
    var seen = {}, out = [];
    items.forEach(function(it){
      var v = it[key];
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    return out;
  }

  function chipRow(el, values, field, allLabel){
    if (values.length < 2) { el.classList.add('hide'); return; }
    el.classList.remove('hide');

    var cur = state[field];
    if (cur !== 'all' && values.indexOf(cur) < 0) { state[field] = cur = 'all'; }

    el.innerHTML = '<button class="chip" data-v="all" aria-pressed="' + (cur === 'all') + '">' +
                   allLabel + '</button>' +
      values.map(function(v){
        return '<button class="chip" data-v="' + esc(v) + '" aria-pressed="' + (cur === v) + '">' +
               esc(v) + '</button>';
      }).join('');
  }

  function bindRow(el, field){
    el.addEventListener('click', function(ev){
      var b = ev.target.closest('.chip'); if (!b) return;
      state[field] = b.dataset.v;
      render();
    });
  }

  var elF = document.getElementById('factories');
  var elP = document.getElementById('specs');
  bindRow(elF, 'f');
  bindRow(elP, 'p');

  document.getElementById('modes').addEventListener('click', function(ev){
    var b = ev.target.closest('.chip'); if (!b) return;
    state.mode = b.dataset.mode;
    [].forEach.call(this.children, function(c){ c.setAttribute('aria-pressed', c === b); });
    render();
  });

  var q = document.getElementById('q'), clr = document.getElementById('clr');
  q.addEventListener('input', function(){
    state.q = q.value.trim().toLowerCase();
    clr.style.display = state.q ? 'block' : 'none';
    render();
  });
  clr.addEventListener('click', function(){
    q.value = ''; state.q = ''; clr.style.display = 'none'; render(); q.focus();
  });

  // ═══════════ Отрисовка ═══════════
  var moreBtn = document.getElementById('more');

  function inCat(){
    return DATA.filter(function(it){ return !state.cat || (it.k || '') === state.cat; });
  }

  function selected(){
    return inCat().filter(function(it){
      if (state.f !== 'all' && it.f !== state.f) return false;
      if (state.p !== 'all' && it.p !== state.p) return false;
      if (state.mode === 'in'  && !inStock(it)) return false;
      if (state.mode === 'low' && !(inStock(it) && it.q < it.w)) return false;
      if (state.q) {
        var hay = it.d + ' ' + it.a + ' ' + it.c +
                  (it.v ? ' ' + it.v.map(function(p){ return p[0]; }).join(' ') : '');
        if (hay.toLowerCase().indexOf(state.q) < 0) return false;
      }
      return true;
    });
  }

  var REG = [];   // карточки текущей отрисовки — для просмотрщика

  function cardHtml(it){
    var tag = tagOf(it);
    REG.push(it);
    // Карточка раскрывается всегда: внутри фото, размеры и характеристики
    return '<article class="card">'
         +   '<div class="shot" data-vi="' + (REG.length - 1) + '" tabindex="0">'
         +     (it.i
                 ? '<img src="' + esc(imgUrl(it.i)) + '" alt="' + esc(it.d) + '" loading="lazy" decoding="async">'
                 : '<div class="blank">' + esc(T().noPhoto) + '</div>')
         +   '</div>'
         +   '<div class="info">'
         +     '<div class="decor">' + esc(it.d) + '</div>'
         +     '<div class="meta"><span class="art">' + esc(T().art) + ' ' + esc(it.a || '—') + '</span>'
         +       (it.p ? '<span class="spec">' + esc(it.p) + '</span>' : '') + '</div>'
         +     (it.s && it.s.pk ? '<div class="pack">' + fmt(it.s.pk) + ' ' + T().m2 + ' · ' + T().perPack.toLowerCase() + '</div>' : '')
         +     '<span class="tag ' + tag[0] + '">' + esc(tag[1]) + '</span>'
         +   '</div>'
         + '</article>';
  }

  function render(reset){
    if (reset !== false) limit = BATCH;
    REG.length = 0;

    var cat = inCat();
    chipRow(elF, uniq(cat, 'f'), 'f', T().allF);
    var byFactory = cat.filter(function(it){ return state.f === 'all' || it.f === state.f; });
    chipRow(elP, uniq(byFactory, 'p'), 'p', T().any);
    updateCount();

    var all = selected();

    // Продвижение: позиции с большим «Приоритетом» выходят первыми и поднимают
    // свою коллекцию в начало. Для дилера это выглядит просто порядком каталога.
    all = all.map(function(it, i){ return [it, i]; })
             .sort(function(a, b){ return (b[0].b || 0) - (a[0].b || 0) || a[1] - b[1]; })
             .map(function(p){ return p[0]; });

    // Заголовок группы показывает общее число позиций, даже если нарисована ещё не вся.
    // Одна коллекция встречается в разных толщинах, поэтому при «Любой» ключ разворачивается.
    var specific = state.p !== "all";
    var manyF    = uniq(all, "f").length > 1;

    // Коллекции нет (плинтусы, фурнитура) — тогда режем только по заводу,
    // а внутри завода весь ассортимент идёт одной непрерывной сеткой.
    function keyOf(it){
      if (it.c) return (specific || !it.p) ? it.c : it.p + " · " + it.c;
      return manyF ? it.f : "";
    }

    var totals = {};
    all.forEach(function(it){ var k = keyOf(it); totals[k] = (totals[k] || 0) + 1; });

    var visible = all.slice(0, limit);
    var order = [], buckets = {};
    visible.forEach(function(it){
      var k = keyOf(it);
      if (!buckets[k]) { buckets[k] = []; order.push(k); }
      buckets[k].push(it);
    });

    var html = '';
    order.forEach(function(k){
      if (k) html += "<div class=\"grouphead\"><h2>" + esc(k) + "</h2><span>" + totals[k] + "</span></div>";
      html += "<div class=\"grid\">" + buckets[k].map(cardHtml).join("") + "</div>";
    });

    document.getElementById('out').innerHTML =
      all.length ? html : '<div class="none">' + esc(T().none) + '</div>';

    var left = all.length - visible.length;
    moreBtn.classList.toggle('on', left > 0);
    moreBtn.textContent = left > 0 ? T().more(Math.min(left, BATCH), left) : '';
  }

  moreBtn.addEventListener('click', function(){ limit += BATCH; render(false); });

  if (window.IntersectionObserver) {
    new IntersectionObserver(function(entries){
      if (entries[0].isIntersecting && moreBtn.classList.contains('on')) {
        limit += BATCH;
        render(false);
      }
    }, { rootMargin: '600px' }).observe(moreBtn);
  }

  // ═══════════ Просмотр фото ═══════════
  var view = document.getElementById('view');
  function openView(el){
    var it = REG[+el.dataset.vi];

    var im = document.getElementById('viewImg');

    else      { im.removeAttribute('src'); card.classList.add('noimg'); }
    document.getElementById('viewTxt').textContent =
      it.d + (it.a ? ' · ' + T().art + ' ' + it.a : '');

    // остатки по размерам: «600 — 5 шт · 700 — 1 шт …», нулевые перечёркнуты
    var sp = document.getElementById("viewSpec");
    var rowsSp = specRows(it);
    sp.innerHTML = rowsSp.map(function(p){
      var wide = String(p[1]).length > 16 ? ' wide' : '';   // длинные значения — на всю ширину
      return '<div class="vs' + wide + '"><i>' + esc(p[0]) + '</i><b>' + esc(p[1]) + '</b></div>';
    }).join('');    sp.style.display = rowsSp.length ? "" : "none";

    var vs = document.getElementById('viewSizes');
    if (it.v && it.v.length) {
      vs.innerHTML = it.v.map(function(p){
        var q   = p[1];
        var txt = p[0] + ' — ' + (q === null ? '?' : fmt(q)) + ' ' + unitOf(it);
        var z   = q !== null && q < MINSTOCK;
        return '<span class="vsz' + (z ? ' z' : '') + '">' + esc(txt) + '</span>';
      }).join('');

      vs.innerHTML = '';
      vs.style.display = 'none';
    }

    view.classList.add('on');
  }

  // Лист прокручивается, поэтому закрывает только фон или крестик — не тап по таблице

  // ═══════════ Язык ═══════════

  // Флаги нарисованы SVG — эмодзи-флаги на Windows превращаются в буквы «GB»

    // выбор хранится в аккаунте Telegram дилера и переезжает между устройствами

  // Порядок выбора языка при входе: аккаунт Telegram → память браузера → язык профиля
  window.tgLang = function(){
    function autoDetect(){
      if (store('lang')) return;           // явный выбор важнее автоопределения
      try {
        var code = tg && tg.initDataUnsafe && tg.initDataUnsafe.user &&
                   tg.initDataUnsafe.user.language_code || '';
        var auto = code.indexOf('uz') === 0 ? 'uz' : code.indexOf('en') === 0 ? 'en' : '';
        if (auto && auto !== lang) { lang = auto; applyLang(); }
      } catch (e) {}
    }
    try {
      if (tg && tg.CloudStorage && tg.CloudStorage.getItem) {
        tg.CloudStorage.getItem('lang', function(err, v){
          if (!err && v && LANGS.indexOf(v) >= 0) {
            if (v !== lang) { lang = v; store('lang', v); applyLang(); }
          } else {
            autoDetect();
          }
        });

      }
    } catch (e) {}
    autoDetect();
  };

  // ═══════════ Данные: мгновенно из кэша, свежее — следом ═══════════
  function applyPayload(p){
    if (!p || !p.items) return false;
    if (p.cfg) {
      NUMBERS  = !!p.cfg.numbers;
      MINSTOCK = Number(p.cfg.minstock) || 0;
      BATCH    = Number(p.cfg.batch) || 24;
      HIDEOUT  = !!p.cfg.hideout;
      OUTLABEL = p.cfg.outlabel || OUTLABEL;
      FOOTNOTE = p.cfg.foot || '';
      setFootnote();
      setSub(p.cfg.subtitle || '');
      var only = document.querySelector('[data-onlyout]');
      if (only) only.style.display = HIDEOUT ? 'none' : '';
    }
    DATA = p.items;
    route();
    return true;
  }

  // ─────────── Категории: главный экран ───────────
  function categories(){ return uniq(DATA, 'k'); }

  /** Иконка подбирается по названию категории; незнакомым — коробка. */
  var SVG_ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';

  // «Паркет» — раньше ламината, «Стеновые панели и профили» — раньше профиля.
  var CAT_ICONS = [
    [/фурнитур|ручк|замк/i,                 // дверная ручка на розетке
      SVG_ + '<circle cx="7.3" cy="12" r="3.1"/><path d="M10.4 11h8.1a1.6 1.6 0 0 1 1.6 1.6V16"/></svg>'],
    [/двер/i,                               // дверной проём
      SVG_ + '<path d="M5 20V5.5A1.5 1.5 0 0 1 6.5 4h11A1.5 1.5 0 0 1 19 5.5V20"/><path d="M3 20h18"/><circle cx="15.3" cy="12.3" r="1" fill="currentColor" stroke="none"/></svg>'],
    [/паркет/i,                             // диагональная укладка
      SVG_ + '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 11.5 10.5 4M3 18 17 4M8.5 20 21 7.5M15 20l6-6"/></svg>'],
    [/ламинат|пол/i,                        // доски вразбежку
      SVG_ + '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.3h18M3 14.6h18M12 4v5.3M7.5 9.3v5.3M16 14.6V20"/></svg>'],
    [/панел|стен|декор/i,                   // рейки на стене
      SVG_ + '<rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M8.2 4v16M12.9 4v16M17.6 4v16"/></svg>'],
    [/профил|угол|алюмин/i,                 // уголок-профиль в сечении
      SVG_ + '<path d="M6 3v13a2.5 2.5 0 0 0 2.5 2.5H21"/><path d="M10.5 3v9a2 2 0 0 0 2 2H21"/></svg>'],
    [/подлож/i,                             // слои
      SVG_ + '<path d="M12 3 21 8l-9 5-9-5 9-5z"/><path d="m3 12.2 9 5 9-5"/><path d="m3 16.2 9 5 9-5"/></svg>'],
    [/плинт/i,                              // профиль плинтуса у стены
      SVG_ + '<path d="M6 3v18"/><path d="M3 21h18"/><path d="M6 13h3.2a1.3 1.3 0 0 1 1.3 1.3V21"/></svg>'],
    [/компенсат|порог|молдинг/i,            // Т-порожек между двумя полами
      SVG_ + '<path d="M8.3 10.5h7.4"/><path d="M12 10.5V18"/><path d="M3 13.5h5M16 13.5h5"/><path d="M3 18h6M15 18h6"/></svg>'],
  ];
  var CAT_DEFAULT =
      SVG_ + '<path d="M21 8.2 12 12.7 3 8.2 12 3.8l9 4.4z"/><path d="M3 8.2v7.6l9 4.4 9-4.4V8.2"/><path d="M12 12.7v7.5"/></svg>';

  function enterCat(c){
    state.cat = c;

    q.value = ''; clr.style.display = 'none';
    var m = document.getElementById('modes');
    [].forEach.call(m.children, function(b){ b.setAttribute('aria-pressed', b.dataset.mode === 'all'); });
    chrome(false);
    render();
    try { scrollTo(0, 0); } catch (e) {}
  }

  function goHome(){
    if (categories().length < 2) return;
    state.cat = null;
    chrome(true);
    renderHome();
  }

  document.getElementById('out').addEventListener('click', function(ev){
    var t = ev.target.closest('.catile');
    if (t) enterCat(t.dataset.cat);
  });
  document.getElementById('back').addEventListener('click', goHome);

  function route(){
    var cs = categories();
    if (cs.length < 2) {              // одна категория — сразу каталог, без главного экрана
      state.cat = cs[0] || null;
      chrome(false);
      render();
    } else if (state.cat && cs.indexOf(state.cat) >= 0) {
      chrome(false);
      render();
    } else {
      goHome();
    }
  }

  function skeleton(){
    var one = '<div class="sk"><div class="ph"></div><div class="ln"></div><div class="ln s"></div></div>';
    document.getElementById('out').innerHTML =
      '<div class="grid">' + new Array(9).join(one) + '</div>';
  }

  function fail(){
    document.getElementById('out').innerHTML =
      '<div class="none">Не удалось загрузить каталог.<br>Проверьте связь и попробуйте ещё раз.' +
      '<button type="button" onclick="location.reload()">Повторить</button></div>';
  }

  // 1. Мгновенная отрисовка из локального кэша прошлого визита
  var shownFromCache = false;
  try {
    var cached = store('payload');
    if (cached) shownFromCache = applyPayload(JSON.parse(cached));
  } catch (e) {}
  if (!shownFromCache) skeleton();

  // 2. Свежие данные из Apps Script — подменяют картинку без мигания
  fetch(EXEC + '?data=json&t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(p){
      applyPayload(p);
      store('payload', JSON.stringify(p));
    })
    .catch(function(){
      if (!shownFromCache) fail();      // кэш уже на экране — молча остаёмся на нём
    });
</script>
</body>
</html>
